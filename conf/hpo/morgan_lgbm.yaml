# @package hpo
#
# Optuna HPO settings for BASELINE 2/6 (Morgan -> LightGBM), pulled in
# automatically by conf/model/morgan_lgbm.yaml's defaults list. Inert for the
# ordinary finetuning/admet/baseline.py driver, which never reads cfg.hpo.
#
# THE SEARCH SPACE IS NOT DEFINED HERE -- it is composed from the shared
# fragments conf/hpo/space/morgan.yaml (identical to the one morgan_mlp and
# both combined models use) and conf/hpo/space/lgbm.yaml (identical to the one
# every other LightGBM baseline uses). Only the optuna RUN settings below are
# per-study. See conf/hpo/space/*.yaml for what is searched and why.
#
# LEAKAGE DISCIPLINE: identical to every other study here -- dedicated `seed`
# disjoint from finetune.seeds, held-out test never read during HPO, selection
# always on validation macro-MAE, and the optimized value never itself
# reported (the winner is re-run through the standard multi-seed driver). See
# finetuning/admet/hpo.py's module docstring.
#
# NO PRUNER, unlike the MLP studies: LightGBM has no epoch loop for Hyperband
# to prune along, it already early-stops per task against the val split, and
# trials are cheap enough that the saving would be marginal. The budget goes
# into more trials instead.
#
# Run: python -m finetuning.admet.hpo dataset=biogen_adme model=morgan_lgbm hpo.n_trials=100

defaults:
  - space/morgan@search_space   # SHARED -- conf/hpo/space/morgan.yaml
  - space/lgbm@search_space     # SHARED -- conf/hpo/space/lgbm.yaml
  - _self_

seed: 0
sampler_seed: 0
n_trials: 100
metric: val.macro
direction: minimize

sampler: tpe                  # tpe | gp | random
n_startup_trials: 15           # random exploration before TPE goes model-based
warm_start: true               # enqueue conf/model/morgan_lgbm.yaml's own values as trial 0
pruner: none                   # see module docstring
pruner_min_resource: 10        # unused while pruner: none
pruner_reduction_factor: 3

final_full: false
