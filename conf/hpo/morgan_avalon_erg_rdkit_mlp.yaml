# @package hpo
#
# Optuna HPO settings for BASELINE 8/8 (Morgan + Avalon + ErG + RDKit
# descriptors -> MLP), pulled in automatically by
# conf/model/morgan_avalon_erg_rdkit_mlp.yaml's defaults list. Inert for the
# ordinary finetuning/admet/baseline.py driver, which never reads cfg.hpo.
#
# THE SEARCH SPACE IS NOT DEFINED HERE -- this combined model composes the
# SAME shared fragments its component featurizers/families use elsewhere:
#   space/morgan  (identical to morgan_mlp's)
#   space/avalon  (new -- use_counts only; n_bits fixed, see that file)
#   space/erg     (new -- fuzz_increment only; max_path fixed, see that file)
#   space/rdkit   (identical to rdkit_mlp's; empty by design)
#   space/mlp     (identical to morgan_mlp's)
# So this baseline is searched over exactly the union of what its parts are
# searched over, with no per-study copy that could drift.
#
# in_dim changes per trial (morgan.n_bits x use_counts, avalon.use_counts);
# finetuning/admet/hpo.py derives in_dim from the actual built features rather than any
# config value, which is what makes that safe.
#
# LEAKAGE DISCIPLINE: identical to every other study here -- dedicated `seed`
# disjoint from finetune.seeds, held-out test never read during HPO, selection
# always on validation macro-MAE, and the optimized value never itself
# reported. See finetuning/admet/hpo.py's module docstring.
#
# Run: python -m finetuning.admet.hpo dataset=biogen_adme model=morgan_avalon_erg_rdkit_mlp hpo.n_trials=50

defaults:
  - space/morgan@search_space   # SHARED -- conf/hpo/space/morgan.yaml
  - space/avalon@search_space   # SHARED -- conf/hpo/space/avalon.yaml
  - space/erg@search_space      # SHARED -- conf/hpo/space/erg.yaml
  - space/rdkit@search_space    # SHARED -- conf/hpo/space/rdkit.yaml (empty by design)
  - space/mlp@search_space      # SHARED -- conf/hpo/space/mlp.yaml
  - _self_

seed: 0
sampler_seed: 0
n_trials: 50
metric: val.macro
direction: minimize

sampler: tpe
n_startup_trials: 10
warm_start: true
pruner: hyperband
pruner_min_resource: 10
pruner_reduction_factor: 3

final_full: false
