# @package hpo
#
# Optuna HPO settings for BASELINE 4/6 (RDKit descriptors -> LightGBM),
# pulled in automatically by conf/model/rdkit_lgbm.yaml's defaults list.
# Inert for the ordinary finetuning/admet/baseline.py driver, which never reads cfg.hpo.
#
# THE SEARCH SPACE IS NOT DEFINED HERE -- it is composed from the shared
# fragments conf/hpo/space/rdkit.yaml (deliberately empty: the descriptor
# block has no tunable knob) and conf/hpo/space/lgbm.yaml (identical to the
# one every other LightGBM baseline uses). Only the optuna RUN settings below
# are per-study.
#
# This is the cheapest study of the six: one fixed feature matrix built once,
# with only boosting hyperparameters searched, and no pruner overhead. Expect
# it to be the strongest classical opponent per unit of compute.
#
# LEAKAGE DISCIPLINE: identical to every other study here -- dedicated `seed`
# disjoint from finetune.seeds, held-out test never read during HPO, selection
# always on validation macro-MAE, and the optimized value never itself
# reported. See finetuning/admet/hpo.py's module docstring.
#
# NO PRUNER -- see conf/hpo/morgan_lgbm.yaml for the reasoning.
#
# Run: python -m finetuning.admet.hpo dataset=biogen_adme model=rdkit_lgbm hpo.n_trials=100

defaults:
  - space/rdkit@search_space    # SHARED -- conf/hpo/space/rdkit.yaml (empty by design)
  - space/lgbm@search_space     # SHARED -- conf/hpo/space/lgbm.yaml
  - _self_

seed: 0
sampler_seed: 0
n_trials: 100
metric: val.macro
direction: minimize

sampler: tpe
n_startup_trials: 15
warm_start: true
pruner: none
pruner_min_resource: 10        # unused while pruner: none
pruner_reduction_factor: 3

final_full: false
