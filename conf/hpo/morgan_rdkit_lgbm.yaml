# @package hpo
#
# Optuna HPO settings for BASELINE 6/6 (Morgan + RDKit descriptors ->
# LightGBM), pulled in automatically by conf/model/morgan_rdkit_lgbm.yaml's
# defaults list. Inert for the ordinary finetuning/admet/baseline.py driver, which never
# reads cfg.hpo.
#
# THE SEARCH SPACE IS NOT DEFINED HERE -- this combined model composes the
# SAME three shared fragments its single-featurizer siblings use:
#   space/morgan  (identical to morgan_mlp's and morgan_lgbm's)
#   space/rdkit   (identical to rdkit_mlp's and rdkit_lgbm's; empty by design)
#   space/lgbm    (identical to morgan_lgbm's and rdkit_lgbm's)
# So this baseline is searched over exactly the union of what its parts are
# searched over -- no per-study copy that could drift. Only the optuna RUN
# settings below are per-study.
#
# This is the widest LGBM search (featurization + boosting) and the battery's
# strongest expected classical opponent, so it gets a full trial budget.
#
# LEAKAGE DISCIPLINE: identical to every other study here -- dedicated `seed`
# disjoint from finetune.seeds, held-out test never read during HPO, selection
# always on validation macro-MAE, and the optimized value never itself
# reported. See finetuning/admet/hpo.py's module docstring.
#
# NO PRUNER -- see conf/hpo/morgan_lgbm.yaml for the reasoning.
#
# Run: python -m finetuning.admet.hpo dataset=biogen_adme model=morgan_rdkit_lgbm hpo.n_trials=100

defaults:
  - space/morgan@search_space   # SHARED -- conf/hpo/space/morgan.yaml
  - space/rdkit@search_space    # SHARED -- conf/hpo/space/rdkit.yaml (empty by design)
  - space/lgbm@search_space     # SHARED -- conf/hpo/space/lgbm.yaml
  - _self_

seed: 0
sampler_seed: 0
n_trials: 100
metric: val.macro
direction: minimize

sampler: tpe
n_startup_trials: 15
warm_start: true
pruner: none
pruner_min_resource: 10        # unused while pruner: none
pruner_reduction_factor: 3

final_full: false
